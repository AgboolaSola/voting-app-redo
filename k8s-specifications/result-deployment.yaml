apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: result
  name: result
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
      - image: ghcr.io/agboolasola/voting-app-redo-result:c700307fcfd3c7e6c33820637105897af06bf7c5
        name: result
        ports:
        - containerPort: 8080
          name: result
