apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: ghcr.io/agboolasola/voting-app-redo-vote:c700307fcfd3c7e6c33820637105897af06bf7c5
        name: vote
        ports:
        - containerPort: 8080
          name: vote
